<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sumários</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2" integrity="sha384-J7cw2fbG1T4C5MirTVUxsZGaMfw2m0XsCgOQEqUvB1OF9VIsHWuZF1GmyVRzs7eu" crossorigin="anonymous"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/script.js" defer></script>
    <script type="module" src="../js/sumarios.js" defer></script>
    <script type="module" src="../js/guard.js" defer></script>
  </head>

  <body data-roles="FORMADOR,COORDENADOR,FORMANDO">
    <div class="dashboard-container">
      <aside class="sidebar hoverable">
        <div class="sidebar-header">
          <a
            href="login.html"
            data-home-link
            style="text-decoration: none; display: flex; align-items: center; gap: 12px"
          >
            <div class="logo-icon"><i class="ph-fill ph-student"></i></div>
            <div class="logo-text">
              <h3>Gestão Pedagógica</h3>
            </div>
          </a>
        </div>
        <nav class="sidebar-menu" data-auto></nav>

        <div class="sidebar-footer">
          <a href="perfil.html" class="menu-item"
            ><i class="ph ph-user"></i
            ><span class="link-text">O Meu Perfil</span></a
          >
          <a href="login.html" class="menu-item logout" title="Sair"
            ><i class="ph ph-sign-out"></i
            ><span class="link-text">Terminar Sessão</span></a
          >
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="user-profile-header">
            <div class="avatar-circle">??</div>
            <div class="user-info">
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-name">Olá, <strong>Utilizador</strong></span>
              </a>
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-role"></span>
              </a>
            </div>
          </div>
        </header>

        <div class="content-area">
          <div class="content-standard">
            <div class="header-flex">
              <div>
                <h1 id="titulo-pagina">Sumários</h1>
                <p class="section-subtitle" id="subtitulo-pagina"></p>
              </div>
            </div>
            <div id="sumarios-conteudo"></div>
          </div>
        </div>
      </main>

      <div id="modal-sumario" class="modal">
        <div class="modal-content section-card">
          <div class="card-header-simple">
            <h3 id="modal-sumario-titulo">Sumário</h3>
            <button type="button" class="btn-icon" id="fechar-modal-sumario" aria-label="Fechar"><i class="ph ph-x"></i></button>
          </div>
          <p id="modal-sumario-aviso" style="display: none; background: #fef2f2; color: #b91c1c; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px"></p>
          <form id="form-sumario">
            <div class="input-group">
              <label for="sumario-texto">O que foi dado nesta aula</label>
              <textarea id="sumario-texto" rows="7" minlength="10" maxlength="5000" required placeholder="Conteúdos, exercícios, trabalhos pedidos…"></textarea>
            </div>
            <button type="submit" class="btn-login">Submeter para validação</button>
          </form>
        </div>
      </div>

    </div>

    <footer>
      <p class="copy">&copy; 2026 - Programação web (frontend)</p>
    </footer>
  </body>
</html>
