<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horário Geral</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2" integrity="sha384-J7cw2fbG1T4C5MirTVUxsZGaMfw2m0XsCgOQEqUvB1OF9VIsHWuZF1GmyVRzs7eu" crossorigin="anonymous"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/script.js" defer></script>
    <script type="module" src="../js/horarioGeral.js" defer></script>
    <script type="module" src="../js/guard.js" defer></script>
  </head>

  <body data-roles="COORDENADOR">
    <div class="dashboard-container">
      <aside class="sidebar hoverable">
        <div class="sidebar-header">
          <a
            href="login.html"
            data-home-link
            style="text-decoration: none; display: flex; align-items: center; gap: 12px"
          >
            <div class="logo-icon"><i class="ph-fill ph-student"></i></div>
            <div class="logo-text">
              <h3>Gestão Pedagógica</h3>
            </div>
          </a>
        </div>
        <nav class="sidebar-menu" data-auto></nav>

        <div class="sidebar-footer">
          <a href="perfil.html" class="menu-item"
            ><i class="ph ph-user"></i
            ><span class="link-text">O Meu Perfil</span></a
          >
          <a href="login.html" class="menu-item logout" title="Sair"
            ><i class="ph ph-sign-out"></i
            ><span class="link-text">Terminar Sessão</span></a
          >
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="user-profile-header">
            <div class="avatar-circle">??</div>
            <div class="user-info">
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-name">Olá, <strong>Utilizador</strong></span>
              </a>
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-role"></span>
              </a>
            </div>
          </div>
        </header>

        <div class="content-area">
          <div class="content-standard">
            <div class="header-flex">
              <div>
                <h1 id="titulo-pagina">Horário Geral</h1>
                <p class="section-subtitle" id="subtitulo-pagina">Todas as aulas da semana, de todas as turmas.</p>
              </div>
            </div>

            <div class="section-card" style="margin-bottom: 20px">
              <div style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap">
                <div class="input-group" style="margin-bottom: 0"><label for="filtro-turma">Turma</label>
                  <select id="filtro-turma"><option value="">Todas</option></select></div>
                <div class="input-group" style="margin-bottom: 0"><label for="filtro-formador">Formador</label>
                  <select id="filtro-formador"><option value="">Todos</option></select></div>
              </div>
            </div>

            <div class="section-card">
              <div class="agenda-toolbar" style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                <button class="btn-icon" id="horario-semana-anterior" title="Semana anterior"><i class="ph ph-caret-left"></i></button>
                <span class="agenda-semana-label" id="horario-semana-label">—</span>
                <button class="btn-icon" id="horario-semana-seguinte" title="Semana seguinte"><i class="ph ph-caret-right"></i></button>
                <button class="btn-card" id="horario-semana-hoje" style="margin-left: auto">Hoje</button>
              </div>
              <p id="horario-resumo" style="color: #64748b; font-size: 13px; margin-bottom: 10px;"></p>
              <div class="agenda-grid-wrap"><div class="agenda-grid" id="horario-grid"></div></div>
            </div>
          </div>
        </div>
      </main>

    </div>

    <footer>
      <p class="copy">&copy; 2026 - Programação web (frontend)</p>
    </footer>
  </body>
</html>
