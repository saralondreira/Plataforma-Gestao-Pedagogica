<!doctype html>
<html lang="pt-PT">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova palavra-passe - Gestão Pedagógica</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <script src="../js/script.js" defer></script>
<script type="module" src="../js/recuperarPassword.js" defer></script>
  <script type="module" src="../js/mostrarPassword.js" defer></script></head>

  <body>
    <div class="main-container">
      <div class="login-side">
        <div class="login-content">
          <div class="brand">
            <h2>Gestão Pedagógica</h2>
            <p class="subtitle">Plataforma de Gestão Pedagógica</p>
          </div>

          <form id="form-redefinir" action="javascript:void(0);">
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px">Escolhe a nova palavra-passe (mínimo 8 caracteres).</p>
            <div class="input-group">
              <label for="password">Nova palavra-passe</label>
              <input type="password" autocomplete="new-password" id="password" name="password" placeholder="••••••••" minlength="8" required />
            </div>
            <div class="input-group">
              <label for="password2">Repete a palavra-passe</label>
              <input type="password" autocomplete="new-password" id="password2" name="password2" placeholder="••••••••" minlength="8" required />
            </div>
            <button type="submit" class="btn-login" style="margin-top: 10px">Guardar nova palavra-passe</button>
            <div class="actions" style="margin-top: 20px; margin-bottom: 0; justify-content: center"><a href="login.html">Voltar ao login</a></div>
          </form>

          <div class="footer-logos">
            <p>Cofinanciado por:</p>
            <div class="logos-placeholder">
              <span>PESSOAS 2030</span> | <span>Portugal 2030</span>
            </div>
          </div>
        </div>
      </div>

      <div class="image-side"></div>
    </div>
    <footer>
      <p class="copy">&copy; 2026 - Programação web (frontend)</p>
    </footer>
  </body>
</html>
