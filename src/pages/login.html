<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Gestão Pedagógica</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="../js/script.js" defer></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAcDx28vAbQ3HUBQq0fAKLQHtTVmcHolZA",
        authDomain: "plataforma-gestaopedagogica.firebaseapp.com",
        projectId: "plataforma-gestaopedagogica",
        storageBucket: "plataforma-gestaopedagogica.firebasestorage.app",
        messagingSenderId: "838874023714",
        appId: "1:838874023714:web:6b12a1e1466e67fe8a877b",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const formLogin = document.getElementById("form-login");
      if (formLogin) {
        formLogin.addEventListener("submit", function (e) {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
              // Sucesso! Redirecionar para o Dashboard
              const user = userCredential.user;
              console.log("Login efetuado com sucesso:", user.email);
              window.location.href = "dashboardCoord.html";
            })
            .catch((error) => {
              alert("As credenciais estão incorretas. Tenta novamente.");
              console.error("Erro do Firebase:", error.message);
            });
        });
      }
    </script>
  </head>

  <body>
    <div class="main-container">
      <div class="login-side">
        <div class="login-content">
          <div class="brand">
            <h2>Gestão Pedagógica</h2>
            <p class="subtitle">Plataforma de Gestão Pedagógica</p>
          </div>

          <form id="form-login">
            <div class="input-group">
              <label for="email">Endereço de Email</label>
              <input
                type="email"
                id="email"
                name="email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.pt$"
                placeholder="ex: exemplo@email.pt"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Palavra-passe</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
            </div>

            <div class="actions">
              <div class="check-group">
                <input type="checkbox" id="remember" />
                <label for="remember">Lembrar-me</label>
              </div>
              <a href="#" class="forgot-pass">Esqueci a palavra-passe</a>
            </div>
            <button type="submit" class="btn-login">
              Entrar na Plataforma
            </button>
          </form>

          <div class="register-area">
            <p>Ainda não tem acesso?</p>
            <a href="forms.html" class="btn-outline">Solicitar credenciais </a>
          </div>

          <div class="footer-logos">
            <p>Cofinanciado por:</p>
            <div class="logos-placeholder">
              <span>PESSOAS 2030</span> | <span>Portugal 2030</span>
            </div>
          </div>
        </div>
      </div>

      <div class="image-side"></div>
    </div>
    <footer>
      <p class="copy">&copy; 2026 - Programação web (frontend)</p>
    </footer>
  </body>
</html>
