<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Documentos</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2" integrity="sha384-J7cw2fbG1T4C5MirTVUxsZGaMfw2m0XsCgOQEqUvB1OF9VIsHWuZF1GmyVRzs7eu" crossorigin="anonymous"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/script.js" defer></script>
    <script type="module" src="../js/documentos.js" defer></script>
    <script type="module" src="../js/guard.js" defer></script>
  </head>

  <body data-roles="FORMADOR,COORDENADOR,FORMANDO">
    <div class="dashboard-container">
      <aside class="sidebar hoverable">
        <div class="sidebar-header">
          <a
            href="login.html"
            data-home-link
            style="text-decoration: none; display: flex; align-items: center; gap: 12px"
          >
            <div class="logo-icon"><i class="ph-fill ph-student"></i></div>
            <div class="logo-text">
              <h3>Gestão Pedagógica</h3>
            </div>
          </a>
        </div>
        <nav class="sidebar-menu" data-auto></nav>

        <div class="sidebar-footer">
          <a href="perfil.html" class="menu-item"
            ><i class="ph ph-user"></i
            ><span class="link-text">O Meu Perfil</span></a
          >
          <a href="login.html" class="menu-item logout" title="Sair"
            ><i class="ph ph-sign-out"></i
            ><span class="link-text">Terminar Sessão</span></a
          >
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="user-profile-header">
            <div class="avatar-circle">??</div>
            <div class="user-info">
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-name">Olá, <strong>Utilizador</strong></span>
              </a>
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-role"></span>
              </a>
            </div>
          </div>
        </header>

        <div class="content-area">
          <div class="content-standard">
            <div class="header-flex">
              <div>
                <h1>Documentos</h1>
                <p class="section-subtitle" id="subtitulo-pagina"></p>
              </div>
            </div>
            <div id="documentos-seletor" class="section-card" style="height: auto; margin-bottom: 20px; display: none">
              <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end">
                <div class="input-group" id="grupo-turma" style="display: none; min-width: 200px">
                  <label for="sel-turma">Turma</label>
                  <select id="sel-turma"></select>
                </div>
                <div class="input-group" style="min-width: 260px">
                  <label for="sel-uc">Unidade curricular</label>
                  <select id="sel-uc"></select>
                </div>
              </div>
            </div>
            <div id="documentos-envio" class="section-card" style="height: auto; margin-bottom: 20px; display: none">
              <div class="card-header-simple"><h3>Enviar documento</h3></div>
              <form id="form-documento" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end">
                <div class="input-group" style="min-width: 240px">
                  <label for="doc-ficheiro">Ficheiro (pdf, office, imagem, txt, zip — até 10 MB)</label>
                  <div id="doc-zona" class="dropzone">
                    <i class="ph ph-upload-simple"></i>
                    <span id="doc-zona-texto">Arrasta o ficheiro para aqui ou clica para escolher</span>
                    <input type="file" id="doc-ficheiro" required />
                  </div>
                </div>
                <div class="input-group">
                  <label for="doc-categoria">Categoria</label>
                  <select id="doc-categoria">
                    <option value="MATERIAL">Material de apoio</option>
                    <option value="PLANO">Plano / programa</option>
                    <option value="AVALIACAO">Avaliação</option>
                    <option value="OUTRO">Outro</option>
                  </select>
                </div>
                <button type="submit" class="btn-login" style="width: auto; padding: 10px 18px">Enviar</button>
              </form>
              <p style="font-size: 12px; color: #64748b; margin-top: 8px">O ficheiro fica guardado com o nome oficial <strong>IDCurso_UC_Data</strong> e os formandos da turma são avisados por email.</p>
            </div>
            <label id="grupo-historico" style="display: none; margin-bottom: 10px; font-size: 14px">
              <input type="checkbox" id="chk-historico" /> Mostrar histórico (inclui removidos)
            </label>
            <div id="documentos-conteudo"></div>
          </div>
        </div>
      </main>

    </div>

    <footer>
      <p class="copy">&copy; 2026 - Programação web (frontend)</p>
    </footer>
  </body>
</html>
