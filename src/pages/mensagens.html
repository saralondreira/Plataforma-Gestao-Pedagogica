<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagens</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.2" integrity="sha384-J7cw2fbG1T4C5MirTVUxsZGaMfw2m0XsCgOQEqUvB1OF9VIsHWuZF1GmyVRzs7eu" crossorigin="anonymous"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../js/script.js" defer></script>
    <script type="module" src="../js/mensagens.js" defer></script>
    <script type="module" src="../js/guard.js" defer></script>
  </head>

  <body data-roles="COORDENADOR,FORMADOR,FORMANDO">
    <div class="dashboard-container">
      <aside class="sidebar hoverable">
        <div class="sidebar-header">
          <a
            href="login.html"
            data-home-link
            style="text-decoration: none; display: flex; align-items: center; gap: 12px"
          >
            <div class="logo-icon"><i class="ph-fill ph-student"></i></div>
            <div class="logo-text">
              <h3>Gestão Pedagógica</h3>
            </div>
          </a>
        </div>
        <nav class="sidebar-menu" data-auto></nav>

        <div class="sidebar-footer">
          <a href="perfil.html" class="menu-item"
            ><i class="ph ph-user"></i
            ><span class="link-text">O Meu Perfil</span></a
          >
          <a href="login.html" class="menu-item logout" title="Sair"
            ><i class="ph ph-sign-out"></i
            ><span class="link-text">Terminar Sessão</span></a
          >
        </div>
      </aside>

      <main class="main-content">
        <header class="top-bar">
          <div class="user-profile-header">
            <div class="avatar-circle">??</div>
            <div class="user-info">
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-name">Olá, <strong>Utilizador</strong></span>
              </a>
              <a href="login.html" data-home-link style="text-decoration: none">
                <span class="user-role"></span>
              </a>
            </div>
          </div>
        </header>

        <div class="content-area">
          <div class="content-standard">
            <div class="header-flex">
              <div>
                <h1 id="titulo-pagina">Mensagens</h1>
                <p class="section-subtitle" id="subtitulo-pagina">Comunicação interna entre formandos, formadores e coordenação.</p>
              </div>
              <button class="btn-login" id="btn-nova-mensagem" type="button" style="width: auto">
                <i class="ph ph-paper-plane-tilt"></i> Nova mensagem
              </button>
            </div>

            <div id="conteudo-mensagens">
            <div class="section-card table-standard" id="cartao-recebidas" style="display: none">
              <div class="card-header-simple"><h3>Recebidas</h3></div>
              <div class="table-container-clean">
                <table class="status-table" id="tabela-recebidas">
                  <thead><tr><th>De</th><th>Assunto</th><th>Mensagem</th><th>Data</th><th>Estado</th><th>Ações</th></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
            <div class="section-card table-standard">
              <div class="card-header-simple"><h3>Enviadas</h3></div>
              <div class="table-container-clean">
                <table class="status-table" id="tabela-enviadas">
                  <thead><tr><th>Para</th><th>Assunto</th><th>Mensagem</th><th>Data</th><th>Resposta</th></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
            </div>
          </div>
        </div>
      </main>

      <div id="modal-nova-mensagem" class="modal">
        <div class="modal-content section-card">
          <div class="card-header-simple">
            <h3 id="modal-nova-mensagem-titulo">Nova mensagem</h3>
            <button class="btn-icon" id="fechar-modal-nova-mensagem" type="button" aria-label="Fechar"><i class="ph ph-x"></i></button>
          </div>
          <form id="form-nova-mensagem" action="javascript:void(0);">
            <div class="input-group">
              <label for="msg-destino">Para</label>
              <select id="msg-destino" required></select>
            </div>
            <div class="input-group" id="grupo-destinatario" style="display: none">
              <label for="msg-destinatario">Formador</label>
              <select id="msg-destinatario"></select>
            </div>
            <div class="input-group">
              <label for="msg-assunto">Assunto</label>
              <input type="text" id="msg-assunto" required minlength="3" maxlength="150" />
            </div>
            <div class="input-group">
              <label for="msg-corpo">Mensagem</label>
              <textarea id="msg-corpo" rows="5" required minlength="3" maxlength="5000"></textarea>
            </div>
            <button type="submit" class="btn-login">Enviar</button>
          </form>
        </div>
      </div>
      <div id="modal-responder" class="modal">
        <div class="modal-content section-card">
          <div class="card-header-simple">
            <h3 id="modal-responder-titulo">Responder</h3>
            <button class="btn-icon" id="fechar-modal-responder" type="button" aria-label="Fechar"><i class="ph ph-x"></i></button>
          </div>
          <form id="form-responder" action="javascript:void(0);">
            <p style="color: #64748b; margin-bottom: 15px" id="responder-info"></p>
            <div class="input-group">
              <label for="responder-texto">Resposta</label>
              <textarea id="responder-texto" rows="5" required maxlength="5000"></textarea>
            </div>
            <button type="submit" class="btn-login">Enviar resposta</button>
          </form>
        </div>
      </div>
    </div>

    <footer>
      <p class="copy">&copy; 2026 - Programação web (frontend)</p>
    </footer>
  </body>
</html>
